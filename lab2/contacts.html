<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакти - StudyFlow</title>
</head>
<body>

<header>
    <img src="images/logo.svg" alt="Логотип StudyFlow" width="50">
    <h1>StudyFlow</h1>
    <nav>
        <a href="index.html">Головна</a>
        <a href="tasks.html">Завдання</a>
        <a href="calendar.html">Календар</a>
        <a href="about.html">Про сервіс</a>
        <a href="contacts.html">Контакти</a>
    </nav>
</header>

<main>
    <h2>Зворотний зв'язок</h2>
    <p>Якщо у вас є питання або пропозиції щодо покращення якості нашого сервісу, заповніть форму нижче</p>

    <form>
        <p>
            <label for="name">Ваше ім'я:</label>
            <input type="text" id="name" name="name" required>
        </p>

        <p>
            <label for="email">Електронна пошта:</label>
            <input type="email" id="email" name="email" required>
        </p>

        <p>
            <label for="topic">Тема повідомлення:</label>
            <input type="text" id="topic" name="topic" required>
        </p>

        <p>
            <label for="message">Повідомлення:</label>
            <textarea id="message" name="message" rows="5" cols="40" minlength="10" maxlength="1000" required></textarea>
        </p>

        <p>
            <input type="checkbox" id="consent" name="consent" required>
            <label for="consent">Погоджуюсь на обробку введених даних</label>
        </p>
        <button type="submit">Надіслати</button>
    </form>
    <p>На даному етапі форма працює лише у демонстраційному режимі</p>
</main>

<footer>
    <p>StudyFlow 2026</p>
</footer>

</body>
</html>
